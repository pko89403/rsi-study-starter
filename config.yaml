rounds: 20
week: 0
validation: data/validation.json
fewshot_pool: data/fewshot_pool.json
tables: data/tables.json
db_dir: data/database
screen_size: 20
noise_margin: 3          # hook accept에서 쓰고 싶을 때의 값. 최종 판정은 loop/kernel.py
screen_drop: 2           # screen에서 이만큼 떨어지면 거부
agent_timeout_sec: 1800
sql_timeout_sec: 5
improver_max_tokens: 4096   # Improver LLM 출력 상한(진단·patch). 7B 정상 patch는 300~600토큰. 추론 모델(Qwen3, gpt-oss)은 생각 토큰도 여기서 쓰므로 8192~16384
editable_blocks: [prompt]    # Improver가 고칠 수 있는 SQL agent 블록. 4주차 예: [prompt, code]. evaluator는 판정이 rules_v0라 열어도 효과가 없다
evolve_files: [sql_agent/run.py, evaluator/rules.py]   # 블록이 들어 있는 파일
log: logs/rounds.jsonl
hook_changed: none       # 이번 주에 바꾼 hook 이름 (결과 표용)
meta_contexts: 60        # make meta-eval이 만드는 서로 다른 상황 수
meta_min_parents: 3      # 서로 다른 parent가 이보다 적으면 판정 보류

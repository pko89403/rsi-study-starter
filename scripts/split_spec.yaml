# 평가 데이터 구성 명세. 운영자가 scripts/make_splits.py로 data/를 만들 때 읽는다.
# 3~8주차 담당자는 자기 주차 칸의 want를 채운다: 자기 method가 고칠 수 있는 문제 유형이 validation 100개 중 최소 몇 개 있어야 하는지.
# test(200)는 같은 비율로 dev DB에서 뽑는다. 같은 유형이 두 주에 걸치면 큰 값을 쓴다. 합이 100을 넘으면 뒤 주차부터 줄인다.
#
# 유형 키 (scripts/make_catalog.py가 붙인다)
#   v0:   v0(gpt-4.1-nano)가 틀린 방식. ok / exec_error / empty / extra_cols / col_order / missing_cols / row_mismatch
#   tags: gold SQL 특징. join / group / having / order / limit / nested / setop / agg / distinct / like / value / multi_cond
#   hardness: easy / medium / hard / extra
seed: 20261024
n_val: 100
n_test: 200
n_pool: 300
weeks:
  3:
    owner: Sonnet 3주차 담당
    method: 'Self-Refine: 비평 기준(조건·논리 체크리스트)을 명시하고 patch 자기 비평→재작성'
    want: {tags: {multi_cond: 10}, v0: {row_mismatch: 15}}
  4:
    owner: Sonnet 4주차 담당
    method: 'Reflexion: diagnose가 실행 오류를 뽑아 build_prompt가 ''이전 실패 원인''으로 되먹임'
    want: {v0: {exec_error: 20}}
  5:
    owner: Sonnet 5주차 담당
    method: 'STaR rationalization: 실행 오류 힌트로 SQL 재생성 (exec_error·missing_cols)'
    want: {v0: {exec_error: 20, missing_cols: 5}}
  6:
    owner: Sonnet 6주차 담당
    method: 'LLM-as-a-Judge: review_patch judge에 오류 유형(행 불일치·열 순서·열 과다) 분류 rubric'
    want: {v0: {col_order: 8, extra_cols: 5, row_mismatch: 10}}
  7:
    owner: Sonnet 7주차 담당
    method: 'AlphaEvolve: 평가 피드백(실행 오류)을 patch prompt에 직접 넣음'
    want: {v0: {exec_error: 15}}
  8:
    owner: Sonnet 8주차 담당
    method: 'Unfireable safety kernel: review_patch 금지 행동 체크리스트 (데이터 유형과 무관)'
    want: {}
